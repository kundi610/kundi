<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Floor Plan Auto-Mapper</title>

    <!-- Leaflet CSS & JavaScript -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; font-family: 'Segoe UI', sans-serif; background: #f8f9fa; }

        #sidebar { padding: 20px; background: #ffffff; border-bottom: 2px solid #e0e0e0; box-shadow: 0 2px 5px rgba(0,0,0,0.05); z-index: 1000; }

        h2 { margin-top: 0; color: #1a73e8; font-size: 1.4rem; }
        .instructions { font-size: 0.9rem; color: #555; margin-bottom: 15px; }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.85rem; color: #333; }
        .input-group input[type="password"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }

        /* Camera Button Styling */
        .file-upload-wrapper { position: relative; overflow: hidden; display: inline-block; width: 100%; }
        .file-upload-wrapper input[type="file"] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; height: 100%; }
        .btn { display: block; width: 100%; background: #1a73e8; color: white; border: none; padding: 12px; font-size: 1rem; border-radius: 6px; font-weight: bold; text-align: center; cursor: pointer; transition: 0.2s; box-sizing: border-box;}
        .btn:hover { background: #1557b0; }
        .btn:disabled { background: #93b6e6; cursor: not-allowed; }

        #status { margin-top: 10px; font-weight: bold; font-size: 0.9rem; color: #d93025; text-align: center; }

        #map-container { flex: 1; width: 100%; position: relative; background: #e9ecef; }
        #map { width: 100%; height: 100%; }

        @media (min-width: 768px) {
            body { flex-direction: row; }
            #sidebar { width: 350px; border-bottom: none; border-right: 2px solid #e0e0e0; }
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>AI Floor Plan Mapper</h2>
        <p class="instructions">Point your camera at a building blueprint or evacuation map. The AI will extract the rooms and make them interactive.</p>

        <div class="input-group">
            <label>Gemini API Key</label>
            <input type="password" id="apiKey" placeholder="AIzaSy...">
        </div>

        <div class="file-upload-wrapper">
            <button class="btn" id="scanBtn" type="button">📸 Scan Floor Plan</button>
            <!-- Opens camera on mobile devices -->
            <input type="file" accept="image/*" capture="environment" id="mapCamera">
        </div>

        <div id="status"></div>
    </div>

    <div id="map-container">
        <div id="map"></div>
    </div>

    <script>
        // 1. Initialize Blank Leaflet Map (Using flat pixel coordinates)
        const map = L.map('map', { crs: L.CRS.Simple, minZoom: -2, maxZoom: 3 });
        let imageOverlay = null;
        let currentObjectUrl = null;
        let drawnPolygons = [];

        const cameraInput = document.getElementById('mapCamera');
        const statusDiv = document.getElementById('status');
        const scanBtn = document.getElementById('scanBtn');

        function setStatus(text, color) {
            statusDiv.innerText = text;
            statusDiv.style.color = color || '#d93025';
        }

        // 2. Handle Image Capture
        cameraInput.addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (!file) return;

            const apiKey = document.getElementById('apiKey').value.trim();
            if (!apiKey) {
                alert("Please enter your Gemini API Key first.");
                cameraInput.value = ''; // allow re-selecting the same file later
                return;
            }

            setStatus("Loading image...", "#1a73e8");
            scanBtn.disabled = true;

            // Use an object URL for display: avoids base64-encoding a
            // multi-megabyte camera photo just to show it on the map.
            const objectUrl = URL.createObjectURL(file);
            const img = new Image();
            img.onload = function () {
                setupMapImage(img, objectUrl);
                processWithAI(img, apiKey).finally(() => {
                    scanBtn.disabled = false;
                    cameraInput.value = ''; // reset so the same photo can be picked again
                });
            };
            img.onerror = function () {
                setStatus("❌ Could not read that image file.");
                URL.revokeObjectURL(objectUrl);
                scanBtn.disabled = false;
                cameraInput.value = '';
            };
            img.src = objectUrl;
        });

        // 3. Render the Photo onto Leaflet Map
        function setupMapImage(img, objectUrl) {
            const bounds = [[0, 0], [img.height, img.width]];

            // Clear previous map layers
            if (imageOverlay) map.removeLayer(imageOverlay);
            drawnPolygons.forEach(p => map.removeLayer(p));
            drawnPolygons = [];

            // Release the previous object URL now that it's no longer needed
            if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
            currentObjectUrl = objectUrl;

            // Add new image
            imageOverlay = L.imageOverlay(objectUrl, bounds).addTo(map);
            map.fitBounds(bounds);
        }

        // 4. Shrink image to save bandwidth and Convert to Base64 (for the AI call only)
        function getBase64FromImage(img) {
            const max_dim = 1200; // Resize to ensure API accepts it quickly
            let width = img.width;
            let height = img.height;

            if (width > max_dim || height > max_dim) {
                if (width > height) { height *= max_dim / width; width = max_dim; }
                else { width *= max_dim / height; height = max_dim; }
            }
            width = Math.round(width);
            height = Math.round(height);

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            // Return base64 string without the 'data:image/jpeg;base64,' prefix
            return canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
        }

        function extractJsonArray(rawText) {
            // Defensive: strip markdown code fences if the model adds them
            // despite response_mime_type being set to JSON.
            const cleaned = rawText.trim().replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
            return JSON.parse(cleaned);
        }

        // 5. Send Image & Prompt to Gemini Vision API
        async function processWithAI(img, apiKey) {
            setStatus("🧠 AI is analyzing map... (this takes a few seconds)", "#1a73e8");
            const base64Data = getBase64FromImage(img);

            const prompt = `
                Analyze this floor plan image. Identify all individual rooms, classrooms, and distinct spaces.
                For each room, perform OCR to read the room number or name.
                Output a structured JSON array where each object contains:
                - "number": The text label of the room.
                - "category": The type of room (e.g. 'Classroom', 'Lab', 'Office', 'Other').
                - "box_2d": The 2D bounding box in [ymin, xmin, ymax, xmax] format, using normalized coordinates strictly from 0 to 1000.
                Return ONLY the valid JSON array.
            `;

            const payload = {
                contents: [{
                    parts: [
                        { text: prompt },
                        { inline_data: { mime_type: "image/jpeg", data: base64Data } }
                    ]
                }],
                generationConfig: {
                    response_mime_type: "application/json"
                }
            };

            try {
                const response = await fetch(
                    `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.7-flash:generateContent`,
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'x-goog-api-key': apiKey // keeps the key out of the URL/query string
                        },
                        body: JSON.stringify(payload)
                    }
                );

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error.message);
                }

                const candidate = data.candidates && data.candidates[0];
                const rawText = candidate && candidate.content && candidate.content.parts &&
                    candidate.content.parts[0] && candidate.content.parts[0].text;

                if (!rawText) {
                    // Covers safety blocks, empty responses, or an unexpected shape
                    const reason = (candidate && candidate.finishReason) || 'no content returned';
                    throw new Error(`AI did not return usable data (${reason}).`);
                }

                const roomData = extractJsonArray(rawText);
                if (!Array.isArray(roomData)) {
                    throw new Error("AI response wasn't a JSON array as expected.");
                }

                drawRoomsOnMap(roomData);
                setStatus(`✅ Success! Detected ${roomData.length} rooms.`, "green");

            } catch (error) {
                console.error(error);
                setStatus("❌ Error: " + error.message);
            }
        }

        // 6. Translate AI Coordinates back into Leaflet Map Polygons
        function drawRoomsOnMap(rooms) {
            if (!imageOverlay) return;
            const bounds = imageOverlay.getBounds();
            const imgHeight = bounds.getNorth();
            const imgWidth = bounds.getEast();

            rooms.forEach(room => {
                if (!Array.isArray(room.box_2d) || room.box_2d.length !== 4) return;
                const [gemini_ymin, gemini_xmin, gemini_ymax, gemini_xmax] = room.box_2d;
                if ([gemini_ymin, gemini_xmin, gemini_ymax, gemini_xmax].some(v => typeof v !== 'number')) return;

                // Gemini returns bounding boxes as [ymin, xmin, ymax, xmax] on a 0-1000 scale.
                // 0,0 is the top-left of the image.
                // Leaflet bounds format: [[SouthWest_Y, SouthWest_X], [NorthEast_Y, NorthEast_X]]
                // In L.CRS.Simple, Y goes UP from the bottom left corner.
                const southWest_Y = imgHeight - (gemini_ymax / 1000 * imgHeight);
                const northEast_Y = imgHeight - (gemini_ymin / 1000 * imgHeight);
                const southWest_X = (gemini_xmin / 1000 * imgWidth);
                const northEast_X = (gemini_xmax / 1000 * imgWidth);

                const roomBounds = [[southWest_Y, southWest_X], [northEast_Y, northEast_X]];

                // Draw the interactive rectangle over the room
                const polygon = L.rectangle(roomBounds, {
                    color: '#ff4757',
                    weight: 3,
                    fillColor: '#ff4757',
                    fillOpacity: 0.3
                }).addTo(map);

                // Add a popup with the room data extracted by the AI
                const label = (room.number || 'Unknown').toString();
                const category = (room.category || 'N/A').toString();
                polygon.bindPopup(`
                    <strong style="font-size:16px;">${label}</strong><br>
                    <span style="color:#666;">Category: ${category}</span>
                `);

                drawnPolygons.push(polygon);
            });
        }
    </script>
</body>
</html>
